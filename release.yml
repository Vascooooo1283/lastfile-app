name: Build LastFile

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0 && git push --tags
  workflow_dispatch:     # or run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION="${VERSION:-1.0}"
          ./build.sh

      - name: Zip the app (preserves bundle structure)
        run: ditto -c -k --keepParent LastFile.app LastFile.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LastFile
          path: LastFile.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LastFile.zip
          generate_release_notes: true
