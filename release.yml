name: Build LastFile

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # Only runs when you've added your Apple Developer secrets (see SIGNING.md)
      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build universal .app
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION="${VERSION:-1.0}"
          bash build.sh

      - name: Notarize and staple
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent LastFile.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple LastFile.app
          spctl --assess --type execute --verbose LastFile.app

      - name: Zip the app
        run: ditto -c -k --keepParent LastFile.app LastFile.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LastFile
          path: LastFile.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LastFile.zip
          generate_release_notes: true

      # Auto-updates your Homebrew tap (repo "homebrew-tap") after each release.
      # Needs a secret HOMEBREW_TAP_TOKEN (see HOMEBREW.md).
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_TAP == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 LastFile.zip | awk '{print $1}')"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          bash scripts/make-cask.sh "$VERSION" "$SHA" "$OWNER" "$REPO" > tap/Casks/lastfile.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Casks/lastfile.rb
          git commit -m "lastfile ${VERSION}" || echo "No changes"
          git push
